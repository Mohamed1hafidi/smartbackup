# ============================================================
# docker-compose.monitoring.yml
# Optionnel – ajoutez avec : docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# ============================================================
# Prérequis : avoir lancé docker-compose.yml principal d'abord
# ============================================================

services:

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: smartbackup-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - smartbackup_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: smartbackup-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-smartbackup_grafana}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         http://localhost:3000
    volumes:
      - smartbackup_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  smartbackup_prometheus_data:
    driver: local
  smartbackup_grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
