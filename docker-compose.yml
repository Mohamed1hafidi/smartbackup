# ============================================================
# SmartBackup — Docker Compose (Environnement LOCAL complet)
# ============================================================
# Usage :
#   cp .env.example .env     # Remplir les variables
#   docker compose up --build
#   docker compose down -v   # Supprimer aussi les volumes
# ============================================================

services:

  # ── PostgreSQL local ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartbackup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-smartbackup}
      POSTGRES_USER:     ${POSTGRES_USER:-smartbackup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbackup}
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - smartbackup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbackup} -d ${POSTGRES_DB:-smartbackup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (émule Cloudflare R2 / S3 en local) ────────────
  minio:
    image: minio/minio:latest
    container_name: smartbackup-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web  →  http://localhost:9001
    volumes:
      - smartbackup_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Création du bucket MinIO au premier démarrage ────────
  createbuckets:
    image: minio/mc:latest
    container_name: smartbackup-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${R2_ACCESS_KEY_ID:-minioadmin} ${R2_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${R2_BUCKET_NAME:-smartbackup-files};
      echo 'Bucket prêt.';
      "

  # ── Backend Spring Boot ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbackup-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartbackup}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartbackup}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartbackup}
      JWT_SECRET:              ${JWT_SECRET:-dev-only-secret-change-me-please-32chars!!}
      JWT_EXPIRATION_MS:       ${JWT_EXPIRATION_MS:-86400000}
      APP_FRONTEND_URL:        ${APP_FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS:    ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      R2_ENDPOINT:             http://minio:9000
      R2_PUBLIC_ENDPOINT:      http://localhost:9000
      R2_BUCKET_NAME:          ${R2_BUCKET_NAME:-smartbackup-files}
      R2_REGION:               ${R2_REGION:-us-east-1}
      R2_ACCESS_KEY_ID:        ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY:    ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_PATH_STYLE_ACCESS:    "true"
      APP_MAX_FILE_SIZE_MB:    ${APP_MAX_FILE_SIZE_MB:-50}
      JAVA_OPTS:               "-Xms128m -XX:MaxRAMPercentage=75 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Frontend React (Vite dev server) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev          # Cible le stage de développement
    container_name: smartbackup-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_APP_NAME:     SmartBackup
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro   # Hot-reload en dev

# ── Volumes persistants ───────────────────────────────────
volumes:
  smartbackup_pgdata:
    driver: local
  smartbackup_minio:
    driver: local
