# ============================================================
# CI — Backend Spring Boot
# Déclenché sur : push/PR vers main ou develop (dossier backend/)
# ============================================================
name: CI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 21
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilation
      - name: Compile
        run: mvn -B compile --no-transfer-progress
        working-directory: backend

      # 4. Tests JUnit + Mockito (H2 en mémoire)
      - name: Run tests
        run: mvn -B test --no-transfer-progress
        working-directory: backend
        env:
          # Variables factices pour les tests (H2, pas de vraie DB)
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-minimum-32-characters-long

      # 5. Rapport de couverture (Surefire)
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

      # 6. Construction image Docker (vérification uniquement, pas de push)
      - name: Build Docker image (verify)
        run: docker build -t smartbackup-backend:ci .
        working-directory: backend
