spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5          # Supabase free tier : 60 connexions max pooler
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  frontend:
    url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  files:
    max-size-mb: ${APP_MAX_FILE_SIZE_MB:50}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
    secret: ${SCHEDULER_SECRET:}
  storage:
    endpoint: ${R2_ENDPOINT}
    public-endpoint: ${R2_PUBLIC_ENDPOINT:}
    bucket: ${R2_BUCKET_NAME}
    region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY_ID}
    secret-key: ${R2_SECRET_ACCESS_KEY}
    path-style-access: "false"
    presigned-url-expiry-seconds: ${R2_PRESIGNED_URL_EXPIRY_SECONDS:900}

server:
  forward-headers-strategy: native
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.smartbackup: ${LOG_LEVEL:INFO}
